version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: eduvatar-postgres
    environment:
      POSTGRES_USER: eduvatar_user
      POSTGRES_PASSWORD: eduvatar_password
      POSTGRES_DB: eduvatar
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduvatar_user -d eduvatar"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduvatar-backend
    environment:
      - DATABASE_URL=postgresql+psycopg://eduvatar_user:eduvatar_password@postgres:5432/eduvatar
      - JWT_SECRET=super-secret-change-in-production-eduvatar-ai-jwt-key-2026
      - LLM_PROVIDER=demo
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - ENVIRONMENT=development
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eduvatar-frontend
    environment:
      - VITE_API_URL=http://localhost:8000
    ports:
      - "5173:80"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
