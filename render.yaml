services:
  - type: web
    name: eduvatar-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: "sqlite:///./eduvatar.db"
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: demo
      - key: CORS_ORIGINS
        value: "*"

