services:
  - type: web
    name: eduvatar-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: eduvatar-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: demo
      - key: CORS_ORIGINS
        value: "https://eduvatar-ai.vercel.app,http://localhost:5173"

databases:
  - name: eduvatar-db
    databaseName: eduvatar
    user: eduvatar_user
    plan: free
