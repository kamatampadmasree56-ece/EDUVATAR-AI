services:
  - type: web
    name: eduvatar-backend
    runtime: python
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: "sqlite:///./eduvatar.db"
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: demo
      - key: EMBEDDING_PROVIDER
        value: demo
      - key: AVATAR_PROVIDER
        value: canvas
      - key: TTS_PROVIDER
        value: browser
      - key: STT_PROVIDER
        value: browser
      - key: CORS_ORIGINS
        value: "*"
      # ↓ Set these in Render dashboard for production AI
      # - key: LLM_API_KEY
      #   value: your-gemini-or-openai-key
      # - key: EMBEDDING_API_KEY
      #   value: your-embedding-api-key
